# EXEMPLE de règles gitleaks : Aulë ne le charge JAMAIS de lui-même. Copiez-le dans VOTRE dossier de règles et adaptez-le, puis donnez ce dossier à Aulë :
#     tools:
#       gitleaks:
#         rules: [./mes-regles/gitleaks]
#
# Pourquoi des règles « sans entropie » : la règle générique de gitleaks exige une valeur de 10 caractères au moins ET une entropie >= 3,5, et un nom de clé contenant
# « password », « secret », « token »… Un mot de passe choisi par un humain (faible entropie) sous une clé `pass` (la propriété de nodemailer, de nombreuses bibliothèques
# SMTP/base de données) n'est jamais signalé. Ces règles se fondent sur le NOM de la clé et sur une valeur littérale, SANS seuil d'entropie : un faux positif se trie, un mot
# de passe manqué ne se rattrape pas. À vous de les resserrer (ou de les élargir) selon votre projet.
#
# Conçues pour le moteur d'expressions de gitleaks (RE2, en Go) : ni anticipation, ni rétroréférence. gitleaks lit des TEXTES : elles s'appliquent à tout type de fichier
# (js, html, ejs, yaml, json, .env, .properties…), sans que la syntaxe soit valide, et à l'historique git.
# `[extend] useDefault = true` : on AJOUTE ces règles aux règles par défaut au lieu de les remplacer (gitleaks >= 8.9.0). Sans cette ligne, ce fichier REMPLACE les règles par
# défaut, comme `gitleaks -c fichier.toml`.
title = "Aulë : identifiants écrits en dur"

[extend]
useDefault = true

# Valeur littérale entre guillemets, affectée à une clé dont le NOM finit par un mot d'identifiant :
#   pass: 'x'   password = "x"   "password": "x"   'password' => 'x'   smtpPass: "x"   DB_PASSWORD = '...'   SECRET_KEY = '...'   apiKey: "..."
# Écartées : valeurs qui commencent par $ < { % @ ! (variable d'environnement, modèle, balise), valeurs de moins de 4 caractères, valeurs avec
# espace (messages d'interface : « Mot de passe »). `bypass: "x"`, `compass: "x"` ne correspondent pas (« pass » seul exige un début de mot).
[[rules]]
id = "aule-credential-quoted"
description = "Identifiant écrit en dur : nom de clé évocateur (pass, password, secret, apiKey…) et valeur littérale, sans seuil d'entropie"
regex = '''(?i)(?:[a-z0-9_.\-]*(?:passw(?:or)?d|passphrase|pwd|secret(?:[_.\-]?(?:key|token))?|api[_.\-]?key|private[_.\-]?key)|(?:^|[^a-z])pass|[a-z0-9](?-i:Pass))["'\x60]?[ \t]*(?:=>|:=|==?|:)[ \t]*["']([^"'\s$<{%@!][^"'\s]{3,})["']'''
secretGroup = 1
keywords = ["pass", "pwd", "secret", "api_key", "apikey", "api-key", "api.key", "private_key", "private-key", "private.key"]
tags = ["credential", "hardcoded", "aule"]

# Même chose SANS guillemets, en début de ligne : YAML, .env, .properties, .ini, shell (export SMTP_PASS=…), Dockerfile (ENV DB_PASS=…), commentaires
# compris (un identifiant en commentaire est tout aussi divulgué). RÉSERVÉE aux fichiers de configuration par un filtre de chemin : dans du code,
# `pass: process.env.SMTP_PASS` ou `password: config.password` sont des EXPRESSIONS, pas des littéraux. « pass » seul exige un séparateur avant
# (SMTP_PASS, smtp.pass, db-pass). Valeurs avec parenthèses, crochets ou virgules écartées.
[[rules]]
id = "aule-credential-unquoted"
description = "Identifiant écrit en dur dans un fichier de configuration (YAML, .env, .properties, .ini, Dockerfile) : nom de clé évocateur et valeur littérale"
path = '''(?i)(?:\.(?:ya?ml|env|properties|ini|conf|cnf|cfg|config|toml|json5?|tfvars|sh|bash|zsh|ps1|txt|plist)|(?:^|[/\\])(?:\.env[^/\\]*|dockerfile[^/\\]*|[^/\\]*\.env))$'''
regex = '''(?im)^[ \t#;/\-]*(?:(?:export|env|arg)[ \t]+)?(?:[a-z0-9_.\-]*(?:passw(?:or)?d|passphrase|pwd|secret(?:[_.\-]?(?:key|token))?|api[_.\-]?key|private[_.\-]?key)|(?:[a-z0-9_.\-]*[_.\-])?pass)[ \t]*[=:][ \t]*([^\s"\'$<{%@!#;()\[\],][^\s"\'#;()\[\],]{3,})[ \t]*(?:#.*)?$'''
secretGroup = 1
keywords = ["pass", "pwd", "secret", "api_key", "apikey", "api-key", "api.key", "private_key", "private-key", "private.key"]
tags = ["credential", "hardcoded", "aule"]

# Éléments XML : <password>x</password> (Maven settings.xml, Tomcat server.xml, web.config, Spring). L'attribut password="x" est déjà couvert par la
# première règle. Les formes modèle (${env.PASS}, #{pass}) sont écartées.
[[rules]]
id = "aule-credential-xml-element"
description = "Identifiant écrit en dur dans un élément XML (<password>…</password>)"
regex = '''(?i)<([a-z0-9_.:\-]*(?:passw(?:or)?d|passphrase|pwd|secret|api[_.\-]?key|private[_.\-]?key))>[ \t]*([^<\s$#{%@!][^<\s]{3,})[ \t]*</'''
secretGroup = 2
keywords = ["password", "passwd", "passphrase", "pwd", "secret", "api_key", "apikey", "api-key", "private_key"]
tags = ["credential", "hardcoded", "xml", "aule"]

# Identifiants dans une URL : postgres://admin:s3cret@db:5432/app, smtp://user:pass@smtp.exemple.fr:587 (nodemailer accepte cette forme),
# mongodb://…, amqp://…, https://user:token@hôte. Les formes modèle (${PASS}, {pass}) sont écartées par le jeu de caractères.
[[rules]]
id = "aule-credential-in-url"
description = "Identifiants écrits en dur dans une URL (schéma://utilisateur:motdepasse@hôte)"
regex = '''(?i)\b[a-z][a-z0-9+.\-]{1,20}://[^\s:/?#@"'<>]{1,64}:([^\s:/?#@"'<>${}\[\]]{3,64})@[^\s/?#"'<>]{1,255}'''
secretGroup = 1
keywords = ["://"]
tags = ["credential", "hardcoded", "url", "aule"]

# Exclusion GLOBALE (la forme `[allowlist]` fonctionne avec toutes les versions de gitleaks ; l'exclusion par règle a changé en 8.21) :
# des valeurs qui ne sont manifestement pas des identifiants. Elle porte sur le secret trouvé, pour toutes les règles, les règles par défaut comprises
# (aucune ne produit ces valeurs). Volontairement ABSENT : « password », « admin », « changeme »… un identifiant par défaut est un VRAI constat d'audit.
[allowlist]
description = "valeurs qui ne sont manifestement pas des identifiants"
regexes = [
  '''(?i)^(?:true|false|null|none|nil|undefined|yes|no|on|off)$''',
  '''^(?:x{3,}|\*{3,}|\.{3,}|-{3,}|_{3,}|#{3,})$''',
]
