*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 28px 8px}
.brand{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--warn);margin-bottom:4px}
.brand span{color:var(--muted);font-weight:400}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);margin-top:4px;font-size:13px}
.notice{margin:10px 28px 0;padding:8px 12px;background:var(--warn-bg);color:var(--warn);border-radius:8px;font-size:13px}
.notice.danger{background:var(--bad-bg);color:var(--bad);font-weight:600}
.notice.info{background:var(--chip);color:var(--muted);font-weight:400}
pre.snippet{margin:0;padding:8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;font:12.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.flow{margin:0;padding-left:20px}
.flow li{margin:2px 0}
.secret{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--bad)}
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 28px;background:var(--bg);border-bottom:1px solid var(--border);margin-top:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab:hover{background:var(--chip)}
.tab[aria-selected=true]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tab .n{margin-left:6px;font-size:11px;background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:9px}
.spacer{flex:1}
select,input[type=search]{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
input[type=search]{min-width:200px}
main{padding:18px 28px 60px;max-width:1500px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:650}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .d{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto;margin-bottom:18px}
.card h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--border)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
tr:last-child td{border-bottom:0}
tr.row:hover td{background:var(--chip)}
tr.clickable{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--chip);margin:0 4px 2px 0;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.accent{background:var(--accent-bg);color:var(--accent)}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--chip);min-width:140px}
.bar>span{display:block;height:100%}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
.detail td{background:var(--chip)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toggle{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:4px 11px;border-radius:14px;cursor:pointer;font:inherit}
.toggle[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.copy{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:6px;cursor:pointer;font-size:11px;padding:1px 6px;margin-left:6px}
.indent{display:inline-block;width:16px;color:var(--muted)}
.triagebox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.tbtn:hover{background:var(--chip)}
.tbtn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:600}
input[type=text],textarea{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
input.grow{flex:1;min-width:220px}
textarea{width:100%;min-height:90px}
.form{padding:14px;display:grid;gap:10px}
.form label{display:grid;gap:4px;color:var(--muted);font-size:12px}
.bulk{padding:6px 10px;background:var(--chip);border-radius:8px}
.graph{display:block;width:100%;height:auto;background:var(--panel)}
.graph text{fill:var(--text);font-size:11px;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.node{cursor:pointer}
.logbox{margin:0;padding:10px;max-height:340px;overflow:auto;font:12px/1.4 var(--mono);white-space:pre-wrap;background:var(--chip)}
.progress{height:8px;background:var(--chip);border-radius:5px;overflow:hidden;margin:8px 0}
.progress>span{display:block;height:100%;background:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:5px;align-items:center;color:var(--text);font-size:13px}
.rawgrid{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:14px;align-items:start}
.rawtree{max-height:78vh;overflow:auto;padding:6px 8px}
.rawentry{margin:6px 0 10px}
.rawentry .head{font-size:12.5px;margin-bottom:2px}
.file{cursor:pointer;padding:2px 8px;border-radius:6px;font-size:12.5px}
.file:hover{background:var(--chip)}
.file.sel{background:var(--accent-bg);color:var(--accent)}
.jtree{padding:8px 10px;font:12.5px/1.55 var(--mono);overflow:auto;max-height:72vh}
.jrow{cursor:pointer;white-space:pre-wrap;word-break:break-all}
.jrow:hover{background:var(--chip)}
.rres{border-bottom:1px solid var(--border);padding:8px 12px;cursor:pointer}
.rres:hover{background:var(--chip)}
.rres .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border)}
.step{font:12.5px/1.45 var(--mono)}
.codegrid{display:grid;grid-template-columns:minmax(240px,310px) minmax(0,1fr);gap:14px;align-items:start}
.ctree{max-height:56vh;overflow:auto;padding:6px 8px;font-size:12.5px}
.cnode{cursor:pointer;padding:1px 4px;border-radius:5px;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.cnode:hover{background:var(--chip)}
.cnode.sel{background:var(--accent-bg);color:var(--accent)}
.cnode .nm{overflow:hidden;text-overflow:ellipsis}
.codebox{border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:64vh;background:var(--panel)}
.cl{display:flex;font:12.5px/1.5 var(--mono);white-space:pre}
.cl .ln{flex:0 0 58px;text-align:right;padding:0 10px 0 4px;color:var(--muted);user-select:none;cursor:pointer}
.cl .mk{flex:0 0 30px;text-align:center}
.cl .src{flex:1 0 auto;padding-right:18px}
.cl.rng{background:var(--warn-bg)}
.cl.tgt{background:var(--accent-bg);box-shadow:inset 3px 0 var(--accent)}
.cl.stp{background:var(--bad-bg)}
.cl.hit .src{outline:1px solid var(--accent)}
.mkb{border:0;border-radius:9px;font:11px/16px system-ui,sans-serif;min-width:18px;padding:0 4px;cursor:pointer;color:#fff;background:var(--muted)}
.mkb.bad{background:var(--bad)}
.mkb.warn{background:var(--warn)}

.crow{display:flex;gap:8px;align-items:baseline;padding:3px 10px;cursor:pointer;font-size:12.5px}
.crow:hover{background:var(--chip)}
.crow.cur{background:var(--accent-bg)}
.cbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0}
.cbar input[type=text]{width:150px}

let projects, byName, rawDirOf, problems;

const secretsOf = p => D.secrets.filter(s => s.project === p);
prepare();

/* ---------- état (reflété dans l'URL pour pouvoir partager une vue) ---------- */
const state = {tab: "synthese", group: true, project: "", q: "", sort: {}, open: new Set(), modes: new Set(), rule: "", triage: "", onlyProblems: false,
  sevSast: new Set(), sastTools: new Set(), sastRule: "", sevDeps: new Set(), depsOnlyVuln: false, secretTools: new Set(), vulnTools: new Set(),
  hideFp: false, crit: "", linkTypes: new Set(), form: null, drafts: {}, revealed: {}, flash: null, run: D.audit.id, diffBase: "", diffData: null,
  diffShow: "new", job: null, jobTools: {}, jobUnpack: false, jobHistory: false, jobCritiq: false,
  raw: {tree: null, loading: false, file: null, sub: "resultats", runIdx: 0, sarif: {}, nodes: {}, open: new Set(), mode: {}, rows: {}, text: {},
        filters: {q: "", rule: "", level: "", file: "", line: "", index: ""}, page: 0, ruleQ: "", ruleOnly: false, rulePage: 0, rowQ: "", rowPage: 0}};
function loadHash() {

}
const inScope = r => !state.project || r.project === state.project || (byName[r.project] || {}).parent === state.project;
const matchesQ = (...parts) => !state.q || parts.join(" ").toLowerCase().includes(state.q.toLowerCase());

/* ---------- tableau triable générique ---------- */
function table(id, columns, rows, opts = {}) {
  const sort = state.sort[id] || opts.defaultSort || null;
  const col = sort && columns.find(c => c.key === sort.key);
  if (sort && col) {
    const val = r => (col.sort ? col.sort(r) : r[col.key]);
    rows = [...rows].sort((a, b) => {
      const x = val(a), y = val(b);
      const c = (x ?? "") < (y ?? "") ? -1 : (x ?? "") > (y ?? "") ? 1 : 0;
      return sort.dir === "desc" ? -c : c;
    });
  }
  const head = h("tr", {}, columns.map(c => h("th", {
    class: (c.num ? "num " : "") + (c.sortable === false ? "" : "sortable"),
    onclick: c.sortable === false ? null : () => {
      const cur = state.sort[id] || opts.defaultSort || {};
      state.sort[id] = {key: c.key, dir: cur.key === c.key && cur.dir === "asc" ? "desc" : "asc"};
      render();
    },
  }, c.label, sort && sort.key === c.key ? (sort.dir === "asc" ? " ▲" : " ▼") : "")));
  const body = [];
  const total = rows.length;
  if (opts.limit && total > opts.limit) rows = rows.slice(0, opts.limit);
  for (const r of rows) {
    const rid = id + ":" + (opts.rowId ? opts.rowId(r) : rows.indexOf(r));
    const open = state.open.has(rid);
    body.push(h("tr", {
      class: "row" + (opts.detail || opts.onRowClick ? " clickable" : ""),
      onclick: opts.onRowClick ? () => opts.onRowClick(r) : opts.detail ? () => { open ? state.open.delete(rid) : state.open.add(rid); render(); } : null,
    }, columns.map(c => h("td", {class: (c.num ? "num " : "") + (c.cls || "")}, c.render ? c.render(r) : r[c.key]))));
    if (open && opts.detail) body.push(h("tr", {class: "detail"}, h("td", {colspan: columns.length}, opts.detail(r))));
  }
  return [h("table", {}, h("thead", {}, head), h("tbody", {}, body)),
    opts.limit && total > opts.limit ? h("div", {class: "empty"}, `Affichage limité aux ${fmt(opts.limit)} premières lignes sur ${fmt(total)} : affinez avec la recherche ou les filtres.`) : null];
}
const card = (title, ...kids) => h("div", {class: "card"}, title ? h("h2", {}, title) : null, ...kids);
const empty = msg => h("div", {class: "empty"}, msg);
const kv = pairs => h("dl", {class: "kv"}, pairs.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)]));

/* ---------- Synthèse ---------- */
function languageBar(name) {

    h("div", {class: "legend"}, techs.slice(0, 3).map(t => `${t.language} ${Math.round(100 * t.code / total)}%`).join(" · ")));
}
function viewSynthese() {
  const scope = projects.filter(p => !state.project || p.name === state.project || p.parent === state.project);

  const sevSummary = list => SEV_ORDER.slice(0, 3).map(k => `${SEV_FR[k]} ${list.filter(x => x.severity === k).length}`).join(" · ");
  const runs = D.runs.filter(r => names.has(r.project));
  const bad = runs.filter(r => !["ok", "skipped"].includes(r.status));
  const kpis = h("div", {class: "kpis"},
    ...[
      [fmt(scope.length), "Projets", `${scope.filter(p => p.parent).length} issu(s) d'archives · ${scope.filter(p => p.is_git).length} avec .git`],
      [fmt(techs.reduce((s, t) => s + t.code, 0)), "Lignes de code", `${new Set(techs.map(t => t.language)).size} langages`],
      [fmt(nGroups(secrets)), "Secrets détectés", `dir ${byMode("dir")} · git ${byMode("git")} · history ${byMode("history")}${recoup(secrets)}`],
      [fmt(nGroups(sast)), "Failles de code (SAST)", `${sevSummary(groupRows(sast))}${recoup(sast)}`],
      [fmt(nGroups(vulns)), "Dépendances vulnérables", `${fmt(D.deps.filter(d => names.has(d.project)).length)} composants · ${sevSummary(groupRows(vulns))}${recoup(vulns)}`],
      [fmt(D.commits.filter(c => names.has(c.project)).length), "Commits extraits", "gittools"],
      [fmt(bad.length), "Exécutions à examiner", `${runs.filter(r => r.status === "ok").length} ok sur ${runs.length}`],
    ].map(([v, l, d]) => h("div", {class: "kpi"}, h("div", {class: "v"}, v), h("div", {class: "l"}, l), h("div", {class: "d"}, d))));
  const rows = scope.map(p => ({...p, secrets: groupRows(secretsOf(p.name)), runs: D.runs.filter(r => r.project === p.name),
    sast: groupRows(D.sast.filter(f => f.project === p.name)), vulns: groupRows(D.vulns.filter(v => v.project === p.name))}));
  const worst = list => list.reduce((m, x) => Math.max(m, SEV_RANK[x.severity] ?? 0), -1);

  const t = table("synthese", [
    {key: "name", label: "Projet", render: r => h("div", {}, r.parent ? h("span", {class: "indent"}, "↳") : null, h("strong", {}, r.name),
        h("div", {class: "muted mono"}, r.origin ? "archive : " + r.origin : r.path))},
    {key: "is_git", label: "Git", sort: r => +r.is_git, render: r => r.is_git ? chip(r.head_commit ? short(r.head_commit) : ".git", "accent") : chip("non")},
    {key: "lang", label: "Technologies", sortable: false, render: r => languageBar(r.name)},
    {key: "nsec", label: "Secrets", num: true, sort: r => r.secrets.length, render: r => r.secrets.length
      ? ["dir", "git", "history"].map(m => { const n = r.secrets.filter(s => s.mode === m).length; return n ? chip(`${m} ${n}`, "bad") : null; })
      : chip("0", "ok")},
    {key: "nsast", label: "SAST", num: true, sort: r => r.sast.length, render: r => sevCell(r.sast)},
    {key: "nvuln", label: "Dépendances vuln.", num: true, sort: r => r.vulns.length, render: r => sevCell(r.vulns)},
    {key: "runs", label: "Exécutions", sort: r => r.runs.filter(x => !["ok", "skipped"].includes(x.status)).length,

  ], rows, {defaultSort: {key: "name", dir: "asc"}, rowId: r => r.name,
    detail: r => kv([["Chemin", h("span", {class: "mono"}, r.path)], ["Commit HEAD", r.head_commit], ["Projet d'origine", r.parent], ["Archive", r.origin],
      ["Constats", D.findings.filter(f => f.project === r.name).length || null], ["Notes de l'auditeur", noteBox(r.name)]])});
  return [kpis, card("Projets", rows.length ? t : empty("Aucun projet"))];
}

/* ---------- Technologies ---------- */
function viewTech() {
  const scope = D.technologies.filter(inScope).filter(t => matchesQ(t.language, t.project));
  const agg = {};
  for (const t of scope) {
    const a = agg[t.language] ||= {language: t.language, projects: new Set(), files: 0, code: 0, comment: 0, blank: 0};
    a.projects.add(t.project); a.files += t.files; a.code += t.code; a.comment += t.comment; a.blank += t.blank;
  }
  const rows = Object.values(agg).map(a => ({...a, nproj: a.projects.size}));
  const total = rows.reduce((s, r) => s + r.code, 0) || 1;
  const main = table("tech", [
    {key: "language", label: "Langage", render: r => [h("span", {class: "chip", style: `background:${color(r.language)};color:#fff`}, "\u00a0"), " ", r.language]},
    {key: "nproj", label: "Projets", num: true},
    {key: "files", label: "Fichiers", num: true, render: r => fmt(r.files)},
    {key: "code", label: "Code", num: true, render: r => fmt(r.code)},
    {key: "comment", label: "Commentaires", num: true, render: r => fmt(r.comment)},
    {key: "blank", label: "Vides", num: true, render: r => fmt(r.blank)},
    {key: "share", label: "Part", sort: r => r.code, render: r => h("div", {class: "bar"}, h("span", {style: `width:${100 * r.code / total}%;background:${color(r.language)}`}))},
  ], rows, {defaultSort: {key: "code", dir: "desc"}});
  const top = rows.sort((a, b) => b.code - a.code).slice(0, 8).map(r => r.language);
  const matrix = [];
  if (!state.project && top.length) {
    const names = [...new Set(scope.map(t => t.project))].sort();
    const cell = (p, l) => (scope.find(t => t.project === p && t.language === l) || {code: 0}).code;
    matrix.push(card("Lignes de code par projet", h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Projet"), top.map(l => h("th", {class: "num"}, l)))),
      h("tbody", {}, names.map(p => h("tr", {}, h("td", {}, p), top.map(l => h("td", {class: "num"}, cell(p, l) ? fmt(cell(p, l)) : h("span", {class: "muted"}, "·")))))))));
  }
  return [card(`Technologies (${rows.length})`, rows.length ? main : empty("Aucune donnée cloc pour ce périmètre.")), ...matrix];
}

/* ---------- Secrets ---------- */
function viewSecrets() {
  const all = D.secrets.filter(inScope);
  const rules = [...new Set(all.map(s => s.rule_id))].sort();
  const tools = [...new Set(all.map(s => s.tool))].sort();
  const rows = all.filter(s => notFp(s) && (!state.modes.size || state.modes.has(s.mode)) && (!state.secretTools.size || state.secretTools.has(s.tool))
    && (!state.rule || s.rule_id === state.rule) && (!state.triage || (s.triage || "none") === state.triage)
    && matchesQ(s.project, s.file, s.rule_id, s.tool, s.commit, s.author, s.description, (clearOf(s) || {}).secret || ""));
  const view = groupRows(rows);
  const modeBtns = ["dir", "git", "history"].map(m => h("button", {class: "toggle", "aria-pressed": state.modes.has(m),
    onclick: () => { state.modes.has(m) ? state.modes.delete(m) : state.modes.add(m); render(); }},
    `${m} (${all.filter(s => s.mode === m).length})`));

    onclick: () => { state.secretTools.has(t) ? state.secretTools.delete(t) : state.secretTools.add(t); render(); }},
    `${t} (${all.filter(s => s.tool === t).length})`)) : [];
  const filters = h("div", {class: "filters"}, modeBtns, toolBtns,
    selectOf(state.rule, [["", "Toutes les règles"], ...rules.map(r => [r, r])], v => state.rule = v),
    selectOf(state.triage, [["", "Tout triage"], ["none", "non trié"], ...TRIAGE_STATES], v => state.triage = v), fpToggle(),
    h("span", {class: "muted"}, countText(rows, view, all, "résultat")));
  const detail = s => {
    const c = clearOf(s);
    return kv([
      LIVE ? ["Triage", triageBox(s)] : ["Commentaire de triage", s.triage_comment],
      ["Avis du modèle d'IA", critBox(s)], ["Détections regroupées", membersBlock(s)],
      ["Description", s.description], ["Outil", s.tool],
      c ? ["Valeur en clair", h("span", {}, h("span", {class: "secret"}, c.secret), copyBtn(c.secret))] : ["Valeur masquée", h("span", {}, h("span", {class: "mono"}, s.secret_masked), revealBtn(s))],
      c && c.match ? ["Ligne en clair", h("span", {class: "secret"}, c.match)] : ["Extrait masqué", s.match_masked ? h("span", {class: "mono"}, s.match_masked) : null],
      ["Auteur", s.author ? `${s.author}${s.email ? " <" + s.email + ">" : ""}` : null], ["Date", s.date], ["Message", s.commit_message],
      ["Vérifié actif", s.verified ? "oui (testé auprès du service)" : null],
      ["Entropie", s.entropy], ["Empreinte (triage)", h("span", {class: "mono"}, s.fingerprint)],
      ["Hash du secret", h("span", {class: "mono"}, s.secret_sha256)],
      s.mode === "history" ? ["Présent dans", `${s.commits_count} commit(s) : ${(s.commits || []).slice(0, 10).map(short).join(", ")}${s.commits_count > 10 ? "…" : ""}`] : ["", null],
      ["Sortie brute", s.raw_report ? h("span", {}, h("span", {class: "mono"}, s.raw_report), ` — entrée n°${s.raw_index}`, copyBtn(s.raw_report)) : null],
      LIVE ? ["", h("div", {class: "triagebox"}, findingButton(s, "secret"), rawLinkBtn(s, "secret"), codeLinkBtn(s, "secret"))] : ["", null],
    ].filter(x => x[0] !== "" || (x[1] && x[1] !== null)).map(x => x[0] === "" ? ["Actions", x[1]] : x));
  };
  const t = table("secrets", [
    {key: "project", label: "Projet"},
    {key: "tool", label: "Outil", render: s => uniqOf(s, x => x.tool).map(t => chip(t))},
    {key: "mode", label: "Mode", render: s => uniqOf(s, x => x.mode).map(m => chip(m, m === "dir" ? "warn" : "accent"))},
    {key: "rule_id", label: "Règle"},
    {key: "file", label: "Fichier", cls: "mono", render: s => s.file},
    {key: "start_line", label: "Ligne", num: true},
    {key: "commit", label: "Commit", cls: "mono", render: s => short(s.commit) || "—"},
    {key: "secret_masked", label: REVEAL ? "Valeur (en clair)" : "Valeur", cls: "mono", sortable: false,
      render: s => { const c = clearOf(s); return c ? h("span", {class: "secret"}, c.secret) : s.secret_masked; }},
    {key: "triage", label: "Triage", render: s => triageChip(s.triage)},
    ...(hasCrit() ? [{key: "critique", label: "IA", sort: s => (s.critique || {}).verdict || "", render: s => critChip(s.critique) || ""}] : []),
    ...groupCol(view),
  ], view, {defaultSort: {key: "project", dir: "asc"}, rowId: s => state.group && s.cluster ? s.cluster.id : s.fingerprint, detail});
  return [filters, bulkBar(view), card(null, rows.length ? t : empty(all.length ? "Aucun résultat pour ces filtres." : "Aucun secret détecté."))];
}

/* ---------- Liens entre projets ---------- */
const REL_FR = {depends_on: "dépend de", shared_secret: "secret partagé", same_remote: "même dépôt d'origine", shared_endpoint: "hôte commun", extracted_from: "extrait de"};
const REL_COLOR = {depends_on: "#3b5bdb", shared_secret: "#c92a2a", same_remote: "#2b8a3e", shared_endpoint: "#e8590c", extracted_from: "#868e96"};
const DIRECTED = new Set(["depends_on", "extracted_from"]);
function relDetail(r) {
  if (r.type === "depends_on") return `via ${(r.via || []).join(", ")}`;
  if (r.type === "shared_secret") return `${r.count} secret(s) : ` + (r.secrets || []).map(x => `${x.rule} ${x.masked}`).join(", ");
  if (r.type === "same_remote") return r.remote;
  if (r.type === "shared_endpoint") return `${r.count} hôte(s) : ` + (r.hosts || []).join(", ");
  if (r.type === "extracted_from") return `archive ${r.archive}`;
  return "";
}
function forceLayout(n, edges, W, H) {  // déterministe : mêmes données, même dessin
  const pos = Array.from({length: n}, (_, i) => ({x: W / 2 + Math.cos(2 * Math.PI * i / n) * W * 0.35, y: H / 2 + Math.sin(2 * Math.PI * i / n) * H * 0.35, vx: 0, vy: 0}));
  const k = Math.sqrt((W * H) / Math.max(n, 1)) * 0.8;
  for (let it = 0; it < 220; it++) {
    const t = 1 - it / 220;
    for (const q of pos) { q.vx = 0; q.vy = 0; }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y; const d = Math.max(Math.hypot(dx, dy), 0.01);
      const f = (k * k) / d; dx /= d; dy /= d;
      pos[i].vx += dx * f; pos[i].vy += dy * f; pos[j].vx -= dx * f; pos[j].vy -= dy * f;
    }
    for (const [i, j] of edges) {
      let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y; const d = Math.max(Math.hypot(dx, dy), 0.01);
      const f = (d * d) / k; dx /= d; dy /= d;
      pos[i].vx -= dx * f; pos[i].vy -= dy * f; pos[j].vx += dx * f; pos[j].vy += dy * f;
    }
    for (const q of pos) {
      const m = Math.hypot(q.vx, q.vy) || 1, step = Math.min(m, 40 * t + 2);
      q.x = Math.min(W - 70, Math.max(70, q.x + q.vx / m * step)); q.y = Math.min(H - 25, Math.max(25, q.y + q.vy / m * step));
    }
  }
  return pos;
}
function viewLinks() {
  const base = D.relations.filter(r => !state.project || r.src === state.project || r.dst === state.project);
  const types = [...new Set(D.relations.map(r => r.type))];
  const rels = base.filter(r => (!state.linkTypes.size || state.linkTypes.has(r.type)) && matchesQ(r.src, r.dst, REL_FR[r.type], relDetail(r)));
  const legend = h("div", {class: "filters"}, types.map(t => h("button", {class: "toggle", "aria-pressed": state.linkTypes.has(t),
    style: `border-left:4px solid ${REL_COLOR[t] || "#999"}`, onclick: () => { state.linkTypes.has(t) ? state.linkTypes.delete(t) : state.linkTypes.add(t); render(); }},
    `${REL_FR[t] || t} (${base.filter(r => r.type === t).length})`)), h("span", {class: "muted"}, `${rels.length} lien(s)`));
  if (!D.relations.length) return card("Liens entre projets", empty("Aucun lien détecté (dépendances, dépôt d'origine, secrets ou hôtes partagés). L'outil « links » est actif par défaut ; il lit manifestes, .git/config et URL."));
  const names = [...new Set(rels.flatMap(r => [r.src, r.dst]))].sort();
  const idx = Object.fromEntries(names.map((nm, i) => [nm, i]));
  const W = 900, Ht = 480, pos = names.length ? forceLayout(names.length, rels.map(r => [idx[r.src], idx[r.dst]]), W, Ht) : [];
  const perPair = {};
  const lines = rels.map(r => {
    const key = [r.src, r.dst].sort().join("|"), n = perPair[key] = (perPair[key] ?? -1) + 1;
    const a = pos[idx[r.src]], b = pos[idx[r.dst]], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, off = (n - 1.5) * 7;
    const ox = -dy / d * off, oy = dx / d * off;
    return svg("line", {x1: (a.x + ox).toFixed(1), y1: (a.y + oy).toFixed(1), x2: (b.x + ox - dx / d * 9).toFixed(1), y2: (b.y + oy - dy / d * 9).toFixed(1),
      stroke: REL_COLOR[r.type] || "#999", "stroke-width": 2, "marker-end": DIRECTED.has(r.type) ? "url(#arrow)" : null}, svg("title", {}, `${r.src} → ${r.dst} : ${REL_FR[r.type] || r.type}`));
  });
  const nodes = names.map((nm, i) => svg("g", {class: "node", onclick: () => { state.project = nm; render(); }},
    svg("circle", {cx: pos[i].x.toFixed(1), cy: pos[i].y.toFixed(1), r: 8, fill: (byName[nm] || {}).parent ? "#868e96" : "#3b5bdb", stroke: "#fff", "stroke-width": 2}),
    svg("text", {x: pos[i].x.toFixed(1), y: (pos[i].y - 13).toFixed(1), "text-anchor": "middle"}, nm.length > 26 ? nm.slice(0, 25) + "…" : nm)));
  const graph = names.length ? svg("svg", {class: "graph", viewBox: `0 0 ${W} ${Ht}`, role: "img", "aria-label": "Graphe des liens entre projets"},
    svg("defs", {}, svg("marker", {id: "arrow", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse"},
      svg("path", {d: "M 0 0 L 10 5 L 0 10 z", fill: "context-stroke"}))), lines, nodes) : null;
  const t = table("links", [
    {key: "type", label: "Lien", render: r => h("span", {class: "chip", style: `border-left:4px solid ${REL_COLOR[r.type] || "#999"}`}, REL_FR[r.type] || r.type)},
    {key: "src", label: "Projets", sort: r => r.src + r.dst, render: r => `${r.src} ${DIRECTED.has(r.type) ? "→" : "↔"} ${r.dst}`},
    {key: "detail", label: "Détail", sort: r => relDetail(r), render: r => relDetail(r)},
  ], rels, {defaultSort: {key: "type", dir: "asc"}, rowId: r => `${r.type}|${r.src}|${r.dst}`, limit: 1500,
    detail: r => kv([["Type", REL_FR[r.type] || r.type], ["De", r.src], ["Vers", r.dst], ["Détail", relDetail(r)]])});
  return [legend, graph ? card(`Graphe (${names.length} projet(s) ; cliquer un projet pour filtrer)`, graph) : null, card("Liens", rels.length ? t : empty("Aucun lien pour ces filtres."))];
}
