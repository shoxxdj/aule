# Configuration de l'assistant d'audit — copier en `aule.yaml` (chargé automatiquement depuis le
# dossier courant) ou passer `--config chemin.yaml`.
# Les chemins relatifs sont relatifs à CE fichier. Tout est optionnel.

# jobs: 4                 # exécutions d'outils en parallèle
# timeout: 1800           # secondes par exécution (surchargeable par outil)
# data_dir: ./data        # base SQLite + sorties brutes

# Décompression des archives trouvées dans les projets (équivalent de --unpack).
# Chaque archive devient un projet « <projet>@<archive> » analysé comme les autres ;
# si elle contient un .git, son historique est analysable (gitleaks git, gittools).
unpack:
  enabled: false
  max_depth: 1            # 1 = archives du projet ; 2 = aussi les archives dans les archives
  max_total_mb: 2048      # taille décompressée maximale par archive (anti bombe de décompression)
  max_files: 200000
  # extensions: [.zip, .tar, .tar.gz, .tgz, .tar.bz2, .tbz2, .tar.xz, .txz]

# Critique par un modèle d'IA (Ollama) des résultats des outils, une fois ceux-ci passés. DÉSACTIVÉE par défaut.
# Activer : enabled: true ici, ou `aule run --critiq`, ou plus tard `aule critiq run`.
# ⚠ Des EXTRAITS DE CODE du client sont envoyés au moteur : endpoint local uniquement (sauf allow_remote: true).
#   Les valeurs de secrets ne sont jamais envoyées (indices calculés localement à la place).
#   Avis CONSULTATIFS : le modèle peut se tromper ; il ne modifie jamais le triage (aule critiq apply : étape explicite).
#   `aule critiq run --dry-run --show 3` affiche le texte EXACT qui serait envoyé, sans rien envoyer.
# Le MOTEUR d'IA (adresse, modèle, clé d'API, TLS…) n'est PAS ici : il est dans un fichier à part, llm.yaml, secrets compris (voir llm.example.yaml).
# Ce fichier-ci ne contient donc aucun secret et peut être versionné.
# llm_file: llm.yaml                  # défaut : llm.yaml à côté de ce fichier ; pour le ranger hors du dépôt : ~/.config/aule/llm.yaml

# Comportement de la critique IA (aule critiq run, ou aule run --critiq)
critiq:
  enabled: false
  # kinds: [secret, sast]            # + vuln pour les dépendances (l'IA peut chercher l'usage du composant dans le code)
  # min_severity: low
  # max_findings: 200                # au plus N constats par passage (les plus graves d'abord)
  # skip_triaged: true               # ne rejuge pas ce que l'humain a déjà trié
  # context_lines: 15                # lignes de code autour du constat
  # max_rounds: 3                    # tours où le modèle peut demander du code complémentaire
  # max_request_lines: 120
  # --- La case « le modèle peut demander BEAUCOUP plus de code » (donné automatiquement). Secrets masqués, deny_globs et confinement au projet restent en vigueur ---
  # allow_more_code: false              # true, ou : aule critiq run --more-code ; case à cocher dans l'interface
  # extended_rounds: 8                  # tours de demandes en mode étendu
  # extended_request_lines: 600         # lignes par plage en mode étendu (jamais moins que max_request_lines)
  # extended_budget_chars: 150000       # code supplémentaire par constat ; avec Ollama, borné par num_ctx (à augmenter dans llm.yaml : 32768)
  # max_prompt_chars: 18000
  # send_secret_values: false        # ⚠ true : envoie les secrets en clair au modèle
  # deny_globs: ["**/.env", "**/*.pem", "**/*.key", ".git/**"]   # fichiers jamais envoyés, même si le modèle les demande

tools:
  cloc:
    # path: /opt/cloc/cloc                 # sinon : « cloc » recherché dans le PATH
    options:
      exclude_dirs: [node_modules, .venv, venv, __pycache__]

  gitleaks:
    # path: C:\tools\gitleaks\gitleaks.exe
    # modes: [dir, git]                    # restreindre les modes (dir, git, history)
    # extra_args: ["--config", "./gitleaks.toml"]
    # env: {HTTPS_PROXY: "http://proxy:3128"}
    # timeout: 3600

  # Opengrep + règles https://github.com/opengrep/opengrep-rules  (SAST).
  # Désactivé par défaut. Active : enabled: true ici, ou --with opengrep.
  # Préparation : `aule update opengrep` clone / met à jour les règles (réseau + git).
  # Ciblage : après cloc, seuls les dossiers de règles des langages détectés sont utilisés
  # (Python -> python/, JavaScript -> javascript/, ...). Un projet sans technologie couverte est ignoré,
  # avec la raison indiquée dans le rapport.
  opengrep:
    enabled: false
    # path: /usr/local/bin/opengrep
    options:
      # rules_path: ./rules/opengrep-rules   # défaut : <data_dir>/rules/opengrep-rules
      # rules_repo: https://github.com/opengrep/opengrep-rules
      # rule_dirs: [python, javascript]      # force les dossiers (désactive le ciblage par technologie)
      # always_include: [generic]            # dossiers ajoutés à chaque projet
      # exclude_rule_dirs: []
      # language_map: {Perl: perl}           # langage cloc -> dossier de règles, en plus des défauts
      # exclude: [node_modules, .venv, venv] # chemins exclus du scan
    # timeout: 3600

  # OWASP Dependency-Check (composants vulnérables). Désactivé par défaut. Active : --with dependency-check.
  # Préparation : `aule update dependency-check` télécharge la base NVD (long ; clé d'API recommandée).
  # ⚠ Clé d'API : variable d'environnement NVD_API_KEY, JAMAIS dans ce fichier. Elle est masquée (***) dans
  #   cmd.txt, meta.json et la base. Une seule exécution à la fois (base H2 partagée).
  # Ciblage : lancé si un écosystème est détecté (langages cloc + pom.xml, package-lock.json, *.jar...).
  dependency-check:
    enabled: false
    # path: ~/tools/dependency-check/bin/dependency-check.sh   # sinon : dependency-check(.sh|.bat) dans le PATH
    options:
      # data_path: ./depcheck-db             # défaut : <data_dir>/depcheck-db
      # nvd_api_key_env: NVD_API_KEY
      # update: true                         # false -> --noupdate (après `aule update`)
      # enable_experimental: false           # Go, Dart, Swift, C/C++
      # formats: [HTML]                      # en plus de JSON ; conservés dans la sortie brute
    # timeout: 7200

  # CodeQL (CLI GitHub) : analyse sémantique, avec le chemin de données source -> puits. Phase 4 (dernière).
  # Désactivé par défaut. Active : enabled: true ici, ou --with codeql.
  # Un MODE PAR LANGAGE (python, javascript-typescript, java-kotlin, csharp, go, c-cpp, ruby) : un projet
  # polyglotte donne une exécution, un statut et une reprise par langage. Langages choisis d'après cloc.
  # Préparation : `aule update codeql` télécharge les paquets de requêtes (ou utiliser le « CodeQL bundle »,
  # qui les embarque : hors ligne). CodeQL ≥ 2.18 recommandé.
  # Compilation : Java/Kotlin et C# sans build (--build-mode=none). Go et C/C++ : autobuild de CodeQL, qui
  # exige toolchain et dépendances (souvent absentes sur du code client) -> donner build_commands.
  # Ressources : une exécution à la fois, délai par défaut 2 h (max_parallel / timeout pour changer).
  codeql:
    enabled: false
    # path: ~/tools/codeql/codeql          # le bundle fournit aussi le binaire
    # modes: [python, javascript-typescript, java-kotlin]   # restreindre les langages analysés
    # max_parallel: 1
    # timeout: 14400
    options:
      # suite: security-extended             # code-scanning | security-extended | security-and-quality
      # pack_versions: {python: "1.4.0"}     # épingler un paquet (reproductibilité)
      # queries: {java-kotlin: ./mes-requetes/audit.qls}      # remplace la suite pour un langage
      # build_commands: {c-cpp: "make -j4"}  # -> --command
      # build_modes: {java-kotlin: autobuild}                 # défaut : java-kotlin et csharp -> none
      # language_map: {Swift: swift}         # langage cloc -> identifiant CodeQL, en plus des défauts
      # min_code_lines: 0                    # ignorer un langage sous ce seuil
      # threads: 0                           # 0 = tous les cœurs
      # ram: 8192                            # Mo
      # search_path: ~/src/codeql            # dépôt github/codeql local (hors ligne)
      # download: false                      # true -> analyze --download
      # analyze_args: []                     # extra_args vaut pour `database create`
      # keep_database: false                 # true : conserve la base (grosse) dans data/work/<run>/codeql/

  # Reconstruction de l'historique : un instantané complet par commit et TOUS les objets
  # (y compris inaccessibles : branche supprimée, historique réécrit). Désactivé par défaut. Active : enabled: true ici,
  # ou --history, ou --with gittools (alias acceptés : gitdump, git-extractor-rs). Alimente l'onglet « Historique »
  # et le mode gitleaks `history`.
  # ⚠ un arbre complet est écrit par commit : prévoir de l'espace disque (aule purge --heavy pour le récupérer).
  # ⚠ git-extractor-rs s'arrête au premier commit dont l'arbre manque : pour un .git INCOMPLET (récupéré d'un serveur), pointez `path:` vers extractor.sh.
  #
  # Exécutable par DÉFAUT : `git-extractor-rs`, ou `git-extractor` (cherchés tous deux ; https://github.com/shoxxdj/git-tools-rs, réécriture en Rust de l'Extractor de
  # GitTools), à installer au préalable ; `git` doit être dans le PATH. Cherché dans le PATH, sinon donnez `path:`.
  gittools:
    enabled: false
    # path: ~/.cargo/bin/git-extractor-rs
    options:
      # threads: 4                         # git-extractor-rs : workers `git cat-file --batch` parallèles (1 à 64)
      # snapshot_date: committer           # date qui préfixe les instantanés : committer (défaut) ou author
      # flavor: auto                       # auto = d'après l'exécutable ; rust ou sh pour forcer
    # Variante historique : extractor.sh de GitTools (internetwache). Reconnu à son extension .sh :
    # path: ~/tools/GitTools/Extractor/extractor.sh
    # launcher: [bash]                     # déduit automatiquement pour un .sh non exécutable

  # ---- Outils optionnels supplémentaires (désactivés par défaut ; activer ici ou avec --with) -----------------------

  # TruffleHog : second avis sur les secrets (fichiers + historique git). Mêmes résultats que gitleaks (onglet Secrets,
  # filtre par outil, secret partagé entre projets, affichage en clair).
  # ⚠ options.verify: true ENVOIE chaque secret trouvé au service concerné (AWS, GitHub...) pour savoir s'il est actif :
  #   c'est un test d'identifiants chez un tiers, hors périmètre de la plupart des missions. Désactivé par défaut.
  trufflehog:
    enabled: false
    options:
      verify: false

  # OSV-Scanner : composants vulnérables d'après les lockfiles/manifestes.
  # ⚠ Par défaut il interroge l'API api.osv.dev : les NOMS ET VERSIONS des dépendances du client quittent la machine
  #   (un avertissement s'affiche au lancement). options.offline: true l'évite (base à télécharger au préalable).
  osv-scanner:
    enabled: false
    options:
      # command: [scan, source]     # osv-scanner ≥ 2 ; [scan] ou [] pour les versions 1.x
      offline: false

  # Trivy : composants vulnérables ET mauvaises configurations IaC (Dockerfile, Terraform, Kubernetes...). Les
  # mauvaises configurations vont dans l'onglet Code (SAST) avec la catégorie `iac`. Trivy ≥ 0.50. Une exécution à la fois.
  trivy:
    enabled: false
    options:
      # scanners: [vuln, misconfig]
      # skip_db_update: false
      # offline: false
      # cache_dir: ~/.cache/trivy

  # Checkov : mauvaises configurations d'infrastructure as code (Terraform, CloudFormation, Kubernetes, Dockerfile, Helm,
  # GitHub Actions...). Lancé seulement si un fichier d'IaC est détecté. Sans clé Prisma, pas de sévérité native.
  checkov:
    enabled: false
    options:
      default_severity: medium

  # Liens entre projets (dépendances, même dépôt d'origine, secrets et hôtes partagés) : actif par défaut, léger.
  links:
    options:
      # ignore_hosts: [corp.example, cdn.interne]   # suffixes de domaine à ne pas relier, en plus des hôtes publics courants

# Rappel : tout outil accepte `max_parallel` (exécutions simultanées), `timeout`, `modes`, `extra_args`, `env`, `launcher`, `path`.
# Par défaut max_parallel vaut 1 pour codeql, trivy et dependency-check.
