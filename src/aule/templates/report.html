<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Audit __AUDIT_ID__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%92%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#1b2330;--muted:#667085;--border:#e2e6ec;--accent:#3b5bdb;--accent-bg:#e8edff;
--ok:#2b8a3e;--ok-bg:#e6f6ea;--warn:#d9480f;--warn-bg:#fff0e6;--bad:#c92a2a;--bad-bg:#ffe8e8;--chip:#eef1f6;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--panel:#171d26;--text:#e6eaf0;--muted:#8b97a8;--border:#273140;
--accent:#7c93ff;--accent-bg:#222c52;--ok:#51cf66;--ok-bg:#15301c;--warn:#ff922b;--warn-bg:#3a2412;--bad:#ff6b6b;--bad-bg:#3a1a1a;--chip:#222b38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 28px 8px}
.brand{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--warn);margin-bottom:4px}
.brand span{color:var(--muted);font-weight:400}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);margin-top:4px;font-size:13px}
.notice{margin:10px 28px 0;padding:8px 12px;background:var(--warn-bg);color:var(--warn);border-radius:8px;font-size:13px}
.notice.danger{background:var(--bad-bg);color:var(--bad);font-weight:600}
.notice.info{background:var(--chip);color:var(--muted);font-weight:400}
pre.snippet{margin:0;padding:8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;font:12.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.flow{margin:0;padding-left:20px}
.flow li{margin:2px 0}
.secret{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--bad)}
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 28px;background:var(--bg);border-bottom:1px solid var(--border);margin-top:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab:hover{background:var(--chip)}
.tab[aria-selected=true]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tab .n{margin-left:6px;font-size:11px;background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:9px}
.spacer{flex:1}
select,input[type=search]{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
input[type=search]{min-width:200px}
main{padding:18px 28px 60px;max-width:1500px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:650}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .d{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto;margin-bottom:18px}
.card h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--border)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
tr:last-child td{border-bottom:0}
tr.row:hover td{background:var(--chip)}
tr.clickable{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--chip);margin:0 4px 2px 0;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.accent{background:var(--accent-bg);color:var(--accent)}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--chip);min-width:140px}
.bar>span{display:block;height:100%}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
.detail td{background:var(--chip)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toggle{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:4px 11px;border-radius:14px;cursor:pointer;font:inherit}
.toggle[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.copy{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:6px;cursor:pointer;font-size:11px;padding:1px 6px;margin-left:6px}
.indent{display:inline-block;width:16px;color:var(--muted)}
.triagebox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.tbtn:hover{background:var(--chip)}
.tbtn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:600}
input[type=text],textarea{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
input.grow{flex:1;min-width:220px}
textarea{width:100%;min-height:90px}
.form{padding:14px;display:grid;gap:10px}
.form label{display:grid;gap:4px;color:var(--muted);font-size:12px}
.bulk{padding:6px 10px;background:var(--chip);border-radius:8px}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);gap:14px;align-items:start}
.lgsvg{display:block;width:100%;aspect-ratio:1000/620;height:auto;background:var(--panel);cursor:grab;touch-action:none;user-select:none}
.lgsvg:active{cursor:grabbing}
.lg-node{cursor:pointer}
.lg-node.dim,.lg-edge-g.dim{opacity:.16}
.lg-label{font:11px system-ui,sans-serif;fill:var(--text);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none}
.lg-el{font:9px system-ui,sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none}
.lg-edge{pointer-events:none}
@media(max-width:900px){.lgrid{grid-template-columns:1fr}}
.logbox{margin:0;padding:10px;max-height:340px;overflow:auto;font:12px/1.4 var(--mono);white-space:pre-wrap;background:var(--chip)}
.progress{height:8px;background:var(--chip);border-radius:5px;overflow:hidden;margin:8px 0}
.progress>span{display:block;height:100%;background:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:5px;align-items:center;color:var(--text);font-size:13px}
.rawgrid{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:14px;align-items:start}
.rawtree{max-height:78vh;overflow:auto;padding:6px 8px}
.rawentry{margin:6px 0 10px}
.rawentry .head{font-size:12.5px;margin-bottom:2px}
.file{cursor:pointer;padding:2px 8px;border-radius:6px;font-size:12.5px}
.file:hover{background:var(--chip)}
.file.sel{background:var(--accent-bg);color:var(--accent)}
.jtree{padding:8px 10px;font:12.5px/1.55 var(--mono);overflow:auto;max-height:72vh}
.jrow{cursor:pointer;white-space:pre-wrap;word-break:break-all}
.jrow:hover{background:var(--chip)}
.rres{border-bottom:1px solid var(--border);padding:8px 12px;cursor:pointer}
.rres:hover{background:var(--chip)}
.rres .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border)}
.step{font:12.5px/1.45 var(--mono)}
.codegrid{display:grid;grid-template-columns:minmax(240px,310px) minmax(0,1fr);gap:14px;align-items:start}
.ctree{max-height:56vh;overflow:auto;padding:6px 8px;font-size:12.5px}
.cnode{cursor:pointer;padding:1px 4px;border-radius:5px;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.cnode:hover{background:var(--chip)}
.cnode.sel{background:var(--accent-bg);color:var(--accent)}
.cnode .nm{overflow:hidden;text-overflow:ellipsis}
.codebox{border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:64vh;background:var(--panel)}
.cl{display:flex;font:12.5px/1.5 var(--mono);white-space:pre}
.cl .ln{flex:0 0 58px;text-align:right;padding:0 10px 0 4px;color:var(--muted);user-select:none;cursor:pointer}
.cl .mk{flex:0 0 30px;text-align:center}
.cl .src{flex:1 0 auto;padding-right:18px}
.cl.rng{background:var(--warn-bg)}
.cl.tgt{background:var(--accent-bg);box-shadow:inset 3px 0 var(--accent)}
.cl.stp{background:var(--bad-bg)}
.cl.hit .src{outline:1px solid var(--accent)}
.mkb{border:0;border-radius:9px;font:11px/16px system-ui,sans-serif;min-width:18px;padding:0 4px;cursor:pointer;color:#fff;background:var(--muted)}
.mkb.bad{background:var(--bad)}
.mkb.warn{background:var(--warn)}
.stepn{display:inline-block;border-radius:9px;background:var(--bad);color:#fff;font:11px/16px system-ui,sans-serif;padding:0 5px;margin-left:8px}
.crow{display:flex;gap:8px;align-items:baseline;padding:3px 10px;cursor:pointer;font-size:12.5px}
.crow:hover{background:var(--chip)}
.crow.cur{background:var(--accent-bg)}
.cbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0}
.cbar input[type=text]{width:150px}
@media print{.toolbar,.copy{display:none}body{background:#fff}}
</style>
</head>
<body>
<header>
  <div class="brand">⚒️ Aulë <span>· le forgeron de l’audit</span></div>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
</header>
<div id="notices"></div>
<div class="toolbar">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="spacer"></div>
  <span id="runwrap"></span>
  <select id="project" aria-label="Projet"></select>
  <input id="q" type="search" placeholder="Rechercher…" aria-label="Rechercher">
</div>
<main id="view"></main>

<script id="audit-data" type="application/json">__AUDIT_DATA__</script>
<script>
"use strict";
let D = JSON.parse(document.getElementById("audit-data").textContent);
const LIVE = !!D.options.live;
const TOKEN = D.options.token || "";

/* ---------- utilitaires (le contenu des dépôts est non fiable : tout passe par textContent) ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k === "value") value = v;
    else if (k === "checked") e.checked = true;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  if (value !== undefined) e.value = value;  // après les enfants : <select> et ses <option>
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, props, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, String(v));
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
const fmt = n => (n ?? 0).toLocaleString("fr-FR");
const short = s => (s ? String(s).slice(0, 8) : "");
const color = lang => { let x = 0; for (const c of lang) x = (x * 31 + c.charCodeAt(0)) % 360; return `hsl(${x} 55% 52%)`; };
const STATUS = {ok: "ok", skipped: "", unavailable: "warn", failed: "bad", timeout: "bad", parse_error: "bad"};
const STATUS_FR = {ok: "ok", skipped: "ignoré", unavailable: "indisponible", failed: "échec", timeout: "délai dépassé", parse_error: "erreur de parsing"};
const SEV_RANK = {critical: 4, high: 3, medium: 2, low: 1, info: 0};
const SEV_FR = {critical: "critique", high: "élevée", medium: "moyenne", low: "faible", info: "info"};
const SEV_ORDER = ["critical", "high", "medium", "low", "info"];
const sevChip = sev => chip(SEV_FR[sev] || sev, sev === "critical" || sev === "high" ? "bad" : sev === "medium" ? "warn" : "");
let REVEAL = !!D.options.reveal;
const TRIAGE_STATES = [["to_review", "à revoir"], ["confirmed", "confirmé"], ["accepted_risk", "risque accepté"], ["false_positive", "faux positif"]];
const TRIAGE_FR = Object.fromEntries(TRIAGE_STATES);
const triageChip = t => !t ? chip("non trié") : chip(TRIAGE_FR[t] || t, t === "confirmed" ? "bad" : t === "to_review" ? "warn" : t === "accepted_risk" ? "accent" : "ok");
const chip = (text, cls) => h("span", {class: "chip " + (cls || "")}, text);
function copyBtn(text) {
  return h("button", {class: "copy", title: "Copier", onclick: ev => {
    ev.stopPropagation();
    if (navigator.clipboard) navigator.clipboard.writeText(text);
  }}, "copier");
}

/* ---------- mode live : API, brouillons, triage ---------- */
function track(p) { (globalThis.__pending ||= []).push(p); return p; }  // permet aux tests d'attendre les actions asynchrones
async function api(path, opts = {}) {
  const res = await fetch(path, {method: opts.method || "GET",
    headers: {"X-Audit-Token": TOKEN, ...(opts.body !== undefined ? {"Content-Type": "application/json"} : {})},
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const run = fn => track((async () => {
  state.flash = null;
  try { await fn(); } catch (e) { state.flash = {msg: String(e.message || e), bad: true}; render(); }
})());
async function refresh() {
  D = await api("/api/data" + (state.run ? `?run=${encodeURIComponent(state.run)}` : ""));
  prepare();
  resetBrowsers();
  if (state.project && !byName[state.project]) state.project = "";
  render();
}
// champ de saisie dont le brouillon survit aux rendus (chaque rendu reconstruit la page)
const draft = (key, initial) => state.drafts[key] ?? initial ?? "";
const textInput = (key, initial, props = {}) => h("input", {type: "text", value: draft(key, initial), oninput: e => { state.drafts[key] = e.target.value; }, ...props});
const labelled = (text, el) => h("label", {}, text, el);
const critOk = r => !state.crit || (state.crit === "none" ? !r.critique : (r.critique || {}).verdict === state.crit);
const notFp = r => !(state.hideFp && r.triage === "false_positive") && critOk(r);
const hasCrit = () => [...D.secrets, ...D.sast, ...D.vulns].some(r => r.critique);
const CRIT_FR = {true_positive: "vrai positif", false_positive: "faux positif", uncertain: "incertain", error: "erreur"};
const critChip = c => !c ? null : c.injection_suspected ? chip("IA ⚠ injection suspectée", "bad")
  : chip(`IA : ${CRIT_FR[c.verdict] || c.verdict}${c.confidence != null ? " " + Math.round(c.confidence * 100) + " %" : ""}`,
      c.verdict === "false_positive" ? "ok" : c.verdict === "true_positive" ? "warn" : c.verdict === "error" ? "bad" : "");
const fpToggle = () => [hasGroups() ? h("button", {class: "toggle", "aria-pressed": state.group, title: "Regroupe les détections identiques (même secret dans le même fichier, même vulnérabilité vue par plusieurs outils) : un seul constat à trier",
    onclick: () => { state.group = !state.group; render(); }}, "regrouper les doublons") : null,
  h("button", {class: "toggle", "aria-pressed": state.hideFp, onclick: () => { state.hideFp = !state.hideFp; render(); }}, "masquer les faux positifs"),
  hasCrit() ? selectOf(state.crit, [["", "Tout avis IA"], ["true_positive", "IA : vrai positif"], ["false_positive", "IA : faux positif"],
    ["uncertain", "IA : incertain"], ["none", "sans avis IA"]], v => state.crit = v) : null];
function critBox(x) {
  const c = x.critique;
  if (!c) return null;
  return h("div", {}, h("div", {class: "muted"}, "Avis consultatif d'un modèle d'IA : à vérifier, il ne modifie pas le triage."),
    h("div", {}, critChip(c), ` ${c.model} · ${c.rounds} tour(s)`), c.reasoning ? h("div", {}, c.reasoning) : null,
    h("div", {class: "muted"}, c.sent.length ? "Code envoyé au modèle : " + c.sent.map(t => t.search ? `recherche « ${t.search} »` : `${t.file}:${t.start}-${t.end}`).join(", ") : "Aucun extrait de code envoyé."));
}
/* ---------- recoupement : une même réalité vue par plusieurs détections = UN constat à trier ---------- */
const isHidden = s => !!s.unreachable_only && groupMembers(s).every(m => m.unreachable_only);   // n'existe que dans des commits que plus aucune référence n'atteint
const HIDDEN_TEXT = "Ce secret ne figure que dans des commits sur lesquels aucune référence (branche, étiquette, remise) ne mène : branche supprimée, historique réécrit… Il est invisible dans `git log` mais récupérable tant que le dépôt n'est pas nettoyé (git gc) : ne considérez pas qu'il a disparu.";
const REASON_FR = {same_secret: "même valeur de secret dans le même fichier", nested_values: "valeurs imbriquées à la même ligne", same_cwe_location: "même CWE, lignes qui se recouvrent",
  flow_endpoint: "extrémité du chemin de données", same_rule_location: "même règle au même emplacement", same_component_vuln: "même composant, même vulnérabilité", alias: "identifiants équivalents (alias CVE / GHSA)"};
let _fpD = null, _fpMap = null;
const fpIndex = () => { if (_fpD !== D) { _fpD = D; _fpMap = new Map([...D.secrets, ...D.sast, ...D.vulns].map(x => [x.fingerprint, x])); } return _fpMap; };
const sizeOf = r => r.cluster ? r.cluster.size : 1;
const hasGroups = () => [...D.secrets, ...D.sast, ...D.vulns].some(x => x.cluster && x.cluster.size > 1);
const fpsOf = item => state.group && item.cluster ? item.cluster.members : [item.fingerprint];
const nGroups = list => state.group ? new Set(list.map(x => x.cluster ? x.cluster.id : x.fingerprint)).size : list.length;
function groupRows(rows) {  // une ligne par groupe : le représentant (le plus grave, le fichier courant en premier)
  if (!state.group) return rows;
  const by = new Map();
  for (const r of rows) { const id = r.cluster ? r.cluster.id : "solo:" + r.fingerprint; (by.get(id) || by.set(id, []).get(id)).push(r); }
  return [...by.values()].map(g => {
    const rep = g.slice().sort((a, b) => (SEV_RANK[b.severity] ?? 0) - (SEV_RANK[a.severity] ?? 0) || (a.mode === "dir" ? 0 : 1) - (b.mode === "dir" ? 0 : 1))[0];
    return sizeOf(rep) > 1 ? {...rep, _group: g} : rep;
  });
}
const groupMembers = r => state.group && sizeOf(r) > 1 ? r.cluster.members.map(fp => fpIndex().get(fp)).filter(Boolean) : [r];
const uniqOf = (r, f) => [...new Set(groupMembers(r).map(f).filter(Boolean))];
const recoup = list => state.group && nGroups(list) !== list.length ? ` · ${list.length} détections recoupées` : "";
const countText = (rows, view, all, noun) => state.group && view.length !== rows.length || state.group && nGroups(all) !== all.length
  ? `${view.length} constat(s) affiché(s) (${rows.length} détection(s)) sur ${nGroups(all)} constat(s) · ${all.length} détection(s)` : `${rows.length} ${noun}(s) sur ${all.length}`;
const groupCol = rows => rows.some(r => sizeOf(r) > 1) ? [{key: "_size", label: "Détections", num: true, sort: sizeOf,
  render: r => sizeOf(r) > 1 ? h("span", {}, chip("×" + sizeOf(r), "accent"), r.cluster.conflict ? chip("⚠ triages divergents", "bad") : null) : ""}] : [];
function membersBlock(r) {
  if (!state.group || sizeOf(r) < 2) return null;
  const ms = groupMembers(r);
  return h("div", {}, h("div", {class: "muted"}, `${ms.length} détections regroupées (${r.cluster.reasons.map(x => REASON_FR[x] || x).join(" · ")}). Le triage s'applique à toutes.`),
    r.cluster.conflict ? h("div", {class: "notice danger", style: "margin:6px 0"}, "⚠ Les détections de ce groupe ont des triages divergents : choisir un triage ci-dessus les aligne toutes.") : null,

/* ---------- tableau triable générique ---------- */
function table(id, columns, rows, opts = {}) {
  const sort = state.sort[id] || opts.defaultSort || null;
  const col = sort && columns.find(c => c.key === sort.key);
  if (sort && col) {
    const val = r => (col.sort ? col.sort(r) : r[col.key]);
    rows = [...rows].sort((a, b) => {
      const x = val(a), y = val(b);
      const c = (x ?? "") < (y ?? "") ? -1 : (x ?? "") > (y ?? "") ? 1 : 0;
      return sort.dir === "desc" ? -c : c;
    });
  }
  const head = h("tr", {}, columns.map(c => h("th", {
    class: (c.num ? "num " : "") + (c.sortable === false ? "" : "sortable"),
    onclick: c.sortable === false ? null : () => {
      const cur = state.sort[id] || opts.defaultSort || {};
      state.sort[id] = {key: c.key, dir: cur.key === c.key && cur.dir === "asc" ? "desc" : "asc"};
      render();
    },
  }, c.label, sort && sort.key === c.key ? (sort.dir === "asc" ? " ▲" : " ▼") : "")));
  const body = [];
  const total = rows.length;
  if (opts.limit && total > opts.limit) rows = rows.slice(0, opts.limit);
  for (const r of rows) {
    const rid = id + ":" + (opts.rowId ? opts.rowId(r) : rows.indexOf(r));
    const open = state.open.has(rid);
    body.push(h("tr", {
      class: "row" + (opts.detail || opts.onRowClick ? " clickable" : ""),
      onclick: opts.onRowClick ? () => opts.onRowClick(r) : opts.detail ? () => { open ? state.open.delete(rid) : state.open.add(rid); render(); } : null,
    }, columns.map(c => h("td", {class: (c.num ? "num " : "") + (c.cls || "")}, c.render ? c.render(r) : r[c.key]))));
    if (open && opts.detail) body.push(h("tr", {class: "detail"}, h("td", {colspan: columns.length}, opts.detail(r))));
  }
  return [h("table", {}, h("thead", {}, head), h("tbody", {}, body)),
    opts.limit && total > opts.limit ? h("div", {class: "empty"}, `Affichage limité aux ${fmt(opts.limit)} premières lignes sur ${fmt(total)} : affinez avec la recherche ou les filtres.`) : null];
}
const card = (title, ...kids) => h("div", {class: "card"}, title ? h("h2", {}, title) : null, ...kids);

      : chip("0", "ok")},
    {key: "nsast", label: "SAST", num: true, sort: r => r.sast.length, render: r => sevCell(r.sast)},
    {key: "nvuln", label: "Dépendances vuln.", num: true, sort: r => r.vulns.length, render: r => sevCell(r.vulns)},

      ["Constats", D.findings.filter(f => f.project === r.name).length || null], ["Notes de l'auditeur", noteBox(r.name)]])});

  return [card(`Technologies (${rows.length})`, rows.length ? main : empty("Aucune donnée cloc pour ce périmètre.")), ...matrix];

/* ---------- Secrets ---------- */

      c && c.match ? ["Ligne en clair", h("span", {class: "secret"}, c.match)] : ["Extrait masqué", s.match_masked ? h("span", {class: "mono"}, s.match_masked) : null],
      ["Auteur", s.author ? `${s.author}${s.email ? " <" + s.email + ">" : ""}` : null], ["Date", s.date], ["Message", s.commit_message],

/* LG-MODEL:BEGIN — modèle du graphe : AUCUN accès au DOM ni à l'état de la page (testé en JavaScript pur par tests/test_graph.py) */
const LG_KINDS = {
  project: {label: "Projet", color: "#3b5bdb"}, derived: {label: "Projet issu d'une archive", color: "#868e96"},
  secret: {label: "Secret partagé", color: "#c92a2a"}, host: {label: "Hôte commun", color: "#e8590c"}, remote: {label: "Dépôt d'origine", color: "#2b8a3e"}};

  const k = Math.sqrt((W * H) / Math.max(n, 1)) * 0.8;
  for (let it = 0; it < 220; it++) {
    const t = 1 - it / 220;
    for (const q of pos) { q.vx = 0; q.vy = 0; }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y; const d = Math.max(Math.hypot(dx, dy), 0.01);

    }
    for (const [i, j] of edges) {

      const f = (d * d) / k; dx /= d; dy /= d;

    }
    for (const q of pos) {
      const m = Math.hypot(q.vx, q.vy) || 1, step = Math.min(m, 40 * t + 2);
      q.x = Math.min(W - 70, Math.max(70, q.x + q.vx / m * step)); q.y = Math.min(H - 25, Math.max(25, q.y + q.vy / m * step));

  const proj = nm => node("p:" + nm, (byName[nm] || {}).parent ? "derived" : "project", nm, {project: nm});
  const edge = (src, dst, type, extra) => {
    const id = `${type}|${src}|${dst}`;

    edges.set(id, {id, src, dst, type, directed: LG_DIRECTED.has(type), ...extra});
    nodes.get(src).deg++; nodes.get(dst).deg++;

    if (r.type === "shared_secret" && (r.secrets || []).length) for (const s of r.secrets) hub(`s:${s.rule}|${s.masked}`, "secret", s.masked, {rule: s.rule, masked: s.masked});
    else if (r.type === "shared_endpoint" && (r.hosts || []).length) for (const host of r.hosts) hub("h:" + host, "host", host, {host});

const lgRadius = n => (n.kind === "project" || n.kind === "derived") ? 15 + Math.min(12, Math.sqrt(n.deg) * 4) : 8 + Math.min(5, n.deg);

    ...D.warnings.map(w => h("div", {class: "notice"}, "⚠ " + w)));
  loadHash();
  document.getElementById("project").addEventListener("change", e => { state.project = e.target.value; render(); });
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
  render();
  if (LIVE) run(async () => { const snap = await api("/api/jobs/current"); if (snap.state === "running") { state.job = {...snap}; render(); await pollJob(); } });
}
init();
</script>
</body>
</html>
